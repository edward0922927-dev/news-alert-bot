# ─────────────────────────────────────────────
#  News Alert Bot 設定檔（改呢度就得，唔使改 code）
# ─────────────────────────────────────────────

# ── 排程規則（cron-job.org 照舊每 10 分鐘觸發；由 bot 決定跑唔跑，時間以倫敦時間計，夏令時間自動處理）──
schedule:
  timezone: Europe/London
  quiet_hours: "00:00-07:00"     # 呢段時間唔跑；之後第一次 run 會補晒
  quiet_days: [0, 1, 2, 3, 4, 5, 6]   # 邊幾日有靜音（0=星期一 … 5=星期六 6=星期日）
  weekday_every_minutes: 10
  weekend_every_minutes: 60      # 星期六、日每個鐘一次
  catchup_after_minutes: 120     # 距離上次 run 超過 2 個鐘 = 補發模式
  catchup_max_items: 30          # 補發最多推幾多條（按 AI 分數揀最重要；阿豬／數據一定保留）

# 每次最多推幾多條（防止大新聞日洗版）
max_items_per_run: 25
# 超過幾多個鐘嘅舊新聞唔推
max_age_hours: 6

# ── Watchlist：ticker + 別名（標題/摘要出現任何一個就算命中）──
# ticker 用大小寫敏感 + 字界匹配（避免 "NOW" 呢類誤中）；別名唔分大小寫
watchlist:
  - ticker: TSLA
    aliases: [Tesla, Musk]
  - ticker: NVDA
    aliases: [Nvidia]
  - ticker: "000660"
    aliases: ["SK hynix", "SK Hynix", HBM]
  # ── AI 供應鏈：大客（佢哋嘅 capex／算力合約／融資 = NVDA 同 HBM 嘅需求）──
  - ticker: MSFT
    aliases: [Microsoft, Azure]
    note: 只關心 AI／雲端／capex／算力合約／晶片採購
  - ticker: ORCL
    aliases: [Oracle]
    note: 只關心 AI 雲端、數據中心、債務／融資、OpenAI 合約
  - ticker: GOOGL
    aliases: [Alphabet, Google]
    note: 只關心 AI／雲端／capex／TPU／數據中心
  - ticker: AMZN
    aliases: [Amazon, AWS]
    note: 只關心 AWS／AI／capex／Trainium／數據中心；零售新聞唔相關
  - ticker: META
    aliases: [Meta Platforms]
    note: 只關心 AI capex／數據中心／融資
  - ticker: CRWV
    aliases: [CoreWeave]
    note: AI 雲端，高負債，佢嘅融資／違約風險係 AI 借貸鏈嘅先兆
  - ticker: OpenAI
    aliases: [OpenAI, Stargate]
    note: 最大算力買家；融資、合約、燒錢速度
  # ── AI 供應鏈：同業 ──
  - ticker: TSM
    aliases: [TSMC, "Taiwan Semiconductor"]
  - ticker: AMD
    aliases: ["Advanced Micro Devices"]
  - ticker: MU
    aliases: [Micron]
  - ticker: SSNLF
    aliases: [Samsung Electronics, "Samsung's chip", "Samsung chip"]
    note: 只關心記憶體／HBM／晶圓代工
  # ── Crypto ──
  - ticker: BTC
    aliases: [Bitcoin, "spot ETF", "bitcoin ETF", IBIT]
  - ticker: ETH
    aliases: [Ethereum, Ether, "ether ETF"]
  - ticker: SOL
    aliases: [Solana]
    note: 只關心 ETF、重大升級／停機、大型機構採用
  - ticker: MSTR
    aliases: [MicroStrategy, "Strategy Inc", "Michael Saylor", Saylor]
    note: 最大 BTC 持有公司；買入／賣出 BTC、融資、MSCI 指數剔除風險
  - ticker: COIN
    aliases: [Coinbase]
  - ticker: USDT
    aliases: [Tether, stablecoin, stablecoins, USDC, Circle]
    note: 穩定幣：儲備、監管、脫鈎、發行量
  - ticker: Binance
    aliases: [Binance, BNB, "CZ", "Changpeng Zhao"]

# ── AI 審核（預設開；冇設 API key 會自動跳過，照用關鍵字）──
llm:
  enabled: true
  provider: gemini          # gemini（免費額度）| anthropic（收費，好平）
  model: auto               # auto = 自動揀最新 Gemini Flash；anthropic 用 claude-haiku-5-5
  min_score: 3              # 1–5，低過呢個唔推；想更靜改 4
  drop_flags: [stale, irrelevant, duplicate, mis-tagged]   # 有呢啲 flag 一律唔推
  scan_unmatched: true      # filter: true 嘅 feed 冇命中關鍵字都交俾 AI 睇，佢覺得重要（≥4 分）先推
  batch_size: 40

# ── 宏觀/事件關鍵字：唔理 ticker，出現就推（只對 filter: true 嘅 feed 生效）──
keywords:
  - FOMC
  - Powell
  - rate cut
  - rate hike
  - CPI
  - payrolls
  - tariff
  - trading halt
  - export controls
  - Treasury yields
  - 10-year yield
  # AI 基建／需求
  - data center
  - data centers
  - hyperscaler
  - hyperscalers
  - AI cloud
  - cloud capacity
  - capex
  - capital expenditure
  - compute deal
  - GPU
  - GPUs
  # AI 融資／信貸（借貸鏈斷裂嘅先兆）
  - private credit
  - credit default swap
  - CDS
  - bond sale
  - bond sales
  - debt sale
  - debt sales
  - debt financing
  - vendor financing
  - circular
  - AI bubble
  # 晶片供應鏈
  - CoWoS
  - DRAM prices
  - DRAM
  - NAND
  - memory chip
  - memory chips
  - foundry
  - memory prices
  - chip ban
  - entity list
  - ASML
  # Crypto
  - ETF inflows
  - ETF outflows
  - net inflows
  - net outflows
  - liquidation
  - liquidations
  - hack
  - hacked
  - exploit
  - depeg
  - depegged
  - halts withdrawals
  - pauses withdrawals
  - insolvency
  - bankruptcy
  - Mt. Gox
  - strategic bitcoin reserve
  - CLARITY Act
  - GENIUS Act
  - market structure bill
  - crypto bill

# ── 排除：標題命中任何一條 regex 就唔推（Google News 會夾雜公司簡介/報價頁）──
exclude_patterns:
  - 'Profile and Biography'
  - 'Stock Price & Latest News'
  - 'Stock Quote'
  - '^[^:]{2,60}(Inc|Corp|Corporation|Ltd|LLC|Co|PLC|AG|SA)\.?\s+-\s+Bloomberg(\.com)?$'
  - '^(Video|Watch|Podcast)\b'
  - 'Page \d+\s+-\s+'                    # 分類頁第 N 頁，例如 "stock investment, Page 3 - KED Global"
  - '^(.{2,40})\s+-\s+\1$'               # 標題同網站名一樣，例如 "The Korea Times - The Korea Times"
  - 'Podcast:'

# ── 情緒標籤（純關鍵字，免費；唔準就自己加減）──
bullish_words: [upgrade, upgraded, beats, beat estimates, raises guidance, raised guidance,
                record, surge, surges, soars, jumps, rallies, outperform, buy rating, approval, approved]
bearish_words: [downgrade, downgraded, misses, missed estimates, cuts guidance, lowered guidance,
                plunge, plunges, slumps, tumbles, falls, probe, investigation, recall, recalls, lawsuit, warns, slower,
                halt, halted, underperform, sell rating, delay, delayed, ban]

# ── 新聞來源 ──
# type: rss         → 直接 RSS
# type: google_news → 自動砌 Google News RSS（用嚟攞 Reuters / Bloomberg）
# filter: true      → 只推命中 watchlist 或 keywords 嘅；false → 全部推
feeds:
  # Seeking Alpha 官方 RSS
  - name: SA 快訊
    type: rss
    url: https://seekingalpha.com/market_currents.xml
    filter: true
  - name: SA TSLA
    type: rss
    url: https://seekingalpha.com/api/sa/combined/TSLA.xml
    filter: false
  - name: SA NVDA
    type: rss
    url: https://seekingalpha.com/api/sa/combined/NVDA.xml
    filter: false

  # Reuters（官方 RSS 2020 年已停，用 Google News 代替）
  - name: Reuters
    type: google_news
    query: 'site:reuters.com (Tesla OR Nvidia OR "SK hynix")'
    filter: true
  - name: Reuters 宏觀
    type: google_news
    query: 'site:reuters.com/markets'
    filter: true

  # Bloomberg（同樣經 Google News）
  - name: Bloomberg
    type: google_news
    query: 'site:bloomberg.com/news (Tesla OR Nvidia OR "SK hynix")'
    filter: true
  - name: Bloomberg 宏觀
    type: google_news
    query: 'site:bloomberg.com/news/articles (Fed OR stocks OR markets)'
    filter: true

  # ── 阿豬（唔經 AI、一定推）──
  - name: 阿豬 Patreon
    type: patreon
    campaign_id: 5320930      # patreon.com/ahju；只攞標題同連結，內容要登入會員先睇到
    filter: false
    skip_ai: true
    icon: "🐷"
    discord_webhook_env: DISCORD_WEBHOOK_AJU   # 有設呢個 secret 就推去阿豬專用頻道，冇就推去預設頻道
  - name: 阿豬 YouTube
    type: rss
    url: https://www.youtube.com/feeds/videos.xml?channel_id=UCBbTnorwzva0ZIMGW0ttwVA
    filter: false
    skip_ai: true
    icon: "🐷"
    discord_webhook_env: DISCORD_WEBHOOK_AJU   # 有設呢個 secret 就推去阿豬專用頻道，冇就推去預設頻道

  # ── X 帳戶（官方 API pay-per-use；要設 X_BEARER_TOKEN secret，否則自動跳過）──
  - name: X @trading_for_bj
    type: x_user
    username: trading_for_bj
    filter: false
    skip_ai: true             # 你揀嚟跟嘅人，唔經 AI 審核；想 AI 篩就改 false
    icon: "𝕏"

  # ── 主題 feed：AI 需求／融資／供應鏈（量大：每日大約 100 條，ai_required = AI 失效就唔推，費事洗版）──
  - name: AI 基建
    type: google_news
    query: '(site:reuters.com OR site:bloomberg.com OR site:cnbc.com) ("data center" OR hyperscaler OR "AI cloud" OR "cloud capacity" OR capex OR "compute deal" OR CoreWeave OR Stargate)'
    filter: false
    ai_required: true
  - name: AI 融資
    type: google_news
    query: '(site:reuters.com OR site:bloomberg.com OR site:ft.com) (AI OR "data center" OR OpenAI OR Oracle OR CoreWeave) (debt OR bond OR "private credit" OR financing OR CDS OR "credit default")'
    filter: false
    ai_required: true
  - name: 晶片供應鏈
    type: google_news
    query: '(site:reuters.com OR site:bloomberg.com OR site:digitimes.com) (HBM OR CoWoS OR "DRAM prices" OR "memory prices" OR TSMC OR ASML OR "export controls" OR "chip ban")'
    filter: false
    ai_required: true

  # ── 官方一手來源 ──
  # SEC 8-K（公司重大事件／業績，通常比新聞早）。要設 SEC_USER_AGENT secret，否則自動跳過
  - name: SEC TSLA
    type: rss
    url: https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0001318605&type=8-K&dateb=&owner=include&count=10&output=atom
    sec: true
    tags: [TSLA]
    filter: false
  - name: SEC NVDA
    type: rss
    url: https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0001045810&type=8-K&dateb=&owner=include&count=10&output=atom
    sec: true
    tags: [NVDA]
    filter: false
  - name: Fed
    type: rss
    url: https://www.federalreserve.gov/feeds/press_all.xml
    filter: true             # 大部分係銀行執法公告；FOMC 會命中關鍵字，其他交俾 AI

  # ── 綜合財經 ──
  - name: MarketWatch
    type: rss
    url: https://feeds.marketwatch.com/marketwatch/topstories
    filter: true
  - name: Investing.com
    type: rss
    url: https://www.investing.com/rss/news_25.rss
    filter: true

  # ── 韓國（SK hynix／Samsung 本地消息通常早過西方媒體；Google News 收錄韓媒好差，所以直接用 RSS）──
  - name: Yonhap
    type: rss
    url: https://en.yna.co.kr/RSS/news.xml
    filter: true
    scan_unmatched: false     # 大部分係一般韓國新聞：冇命中關鍵字就唔交俾 AI，慳額度
  - name: The Elec
    type: rss
    url: https://www.thelec.net/rss/allArticle.xml
    filter: true
    scan_unmatched: false
  - name: Korea Times
    type: rss
    url: https://www.koreatimes.co.kr/www/rss/biz.xml
    filter: true
    scan_unmatched: false

  # ── Crypto ──
  - name: Crypto 主流媒體
    type: google_news
    query: '(site:reuters.com OR site:bloomberg.com OR site:ft.com OR site:wsj.com) (intitle:bitcoin OR intitle:crypto OR intitle:stablecoin OR intitle:Coinbase OR intitle:Binance OR intitle:Tether OR intitle:ETF OR intitle:MicroStrategy)'
    filter: false
    ai_required: true
  - name: Cointelegraph
    type: rss
    url: https://cointelegraph.com/rss
    filter: true
  - name: Decrypt
    type: rss
    url: https://decrypt.co/feed
    filter: true
  - name: CryptoSlate
    type: rss
    url: https://cryptoslate.com/feed/
    filter: true
  - name: DL News
    type: rss
    url: https://www.dlnews.com/arc/outboundfeeds/rss/
    filter: true
  - name: Bitcoin Magazine
    type: rss
    url: https://bitcoinmagazine.com/.rss/full/
    filter: true
  - name: Blockworks
    type: rss
    url: https://blockworks.co/feed
    filter: true
  - name: The Defiant
    type: rss
    url: https://thedefiant.io/api/feed
    filter: true
  - name: SEC 新聞稿
    type: rss
    url: https://www.sec.gov/news/pressreleases.rss
    filter: true              # 只推命中關鍵字嘅（例如 ETF、crypto、Coinbase）
  - name: CoinDesk
    type: rss
    url: https://www.coindesk.com/arc/outboundfeeds/rss/
    filter: true
  - name: The Block
    type: rss
    url: https://www.theblock.co/rss.xml
    filter: true

  # ── 散戶情緒（嘈，預設關；開之前建議 AI 審核要開住）──
  # - name: r/wallstreetbets
  #   type: rss
  #   url: https://www.reddit.com/r/wallstreetbets/.rss
  #   filter: true

  # 後備：如果 Seeking Alpha 封咗 GitHub 嘅 IP（403），開返呢條
